
name: user-statistician

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/user-statistician.yml'

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate language statistics
        uses: cicirello/user-statistician@v1
        with:
          colors: dark
          category-order: languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
